<body>

    <header class="page-heading">
        <h1>Vibely - Enjoy Non-stop Music</h1>
        <p>Your music, your mood, your vibe.</p>
    </header>

    <main class="login-layout">

         LEFT SIDE: SIGN-UP FORM

        <section class="form-section">

            <div class="login-card">

                <h2>Create Account</h2>
                <p class="subtitle">
                    Join Vibely and discover your music world
                </p>

                <div id="message" class="message"
                     role="status" aria-live="polite"></div>

                <form id="signupForm">

                    <div>
                        <label for="name" class="form-label">Name</label>
                        <input type="text"
                               class="form-control"
                               id="name"
                               name="name"
                               placeholder="Enter your name"
                               autocomplete="name"
                               minlength="2"
                               required>
                    </div>

                    <div>
                        <label for="email" class="form-label">
                            Email Address
                        </label>
                        <input type="email"
                               class="form-control"
                               id="email"
                               name="email"
                               placeholder="Enter your email"
                               autocomplete="email"
                               required>
                    </div>

                    <div>
                        <label for="password" class="form-label">
                            Password
                        </label>

                        <div class="password-wrap">
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   placeholder="Create a password"
                                   autocomplete="new-password"
                                   minlength="8"
                                   required>

                            <button type="button"
                                    class="toggle-password"
                                    data-target="password"
                                    aria-label="Show password">
                                Show
                            </button>
                        </div>

                        <div class="strength-track">
                            <div id="strengthBar" class="strength-bar"></div>
                        </div>

                        <p id="strengthText" class="strength-text">
                            Use at least 8 characters.
                        </p>
                    </div>

                    <div>
                        <label for="c_password" class="form-label">
                            Confirm Password
                        </label>

                        <div class="password-wrap">
                            <input type="password"
                                   class="form-control"
                                   id="c_password"
                                   name="c_password"
                                   placeholder="Re-enter your password"
                                   autocomplete="new-password"
                                   minlength="8"
                                   required>

                            <button type="button"
                                    class="toggle-password"
                                    data-target="c_password"
                                    aria-label="Show confirm password">
                                Show
                            </button>
                        </div>
                    </div>

                    <div class="remember-row">

                        <div class="form-check">
                            <input type="checkbox"
                                   class="form-check-input"
                                   id="remember"
                                   name="remember">

                            <label class="form-check-label"
                                   for="remember">
                                Remember me
                            </label>
                        </div>

                        <a href="forgot-password.html"
                           class="forgot-link">
                            Forgot password?
                        </a>
                    </div>

                    <button type="submit" class="login-btn">
                        Create Account
                    </button>

                    <p class="signup-text">

                        <a href="login.html">Log in</a>
                    </p>

                </form>

        </section>

         RIGHT SIDE: VIBELY LOGO

                 alt="Vibely Music Logo">

            <p class="logo-caption">

        </section>

    </main>

    <script>
        const form = document.getElementById("signupForm");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("c_password");
        const strengthBar = document.getElementById("strengthBar");
        const strengthText = document.getElementById("strengthText");
        const message = document.getElementById("message");

        // Show or hide password
        document.querySelectorAll(".toggle-password").forEach(button => {
            button.addEventListener("click", function () {
                const field = document.getElementById(this.dataset.target);
                const isHidden = field.type === "password";

                field.type = isHidden ? "text" : "password";
                this.textContent = isHidden ? "Hide" : "Show";
                this.setAttribute(
                    "aria-label",
                    (isHidden ? "Hide " : "Show ") +
                    (this.dataset.target === "password"
                        ? "password"
                        : "confirm password")
                );
            });
        });

        // Password strength indicator
        password.addEventListener("input", function () {
            const value = password.value;
            let score = 0;

            if (value.length >= 8) score++;
            if (/[A-Z]/.test(value)) score++;
            if (/[a-z]/.test(value) && /\d/.test(value)) score++;
            if (/[^A-Za-z0-9]/.test(value)) score++;

            const levels = [
                { width: "0%", color: "#393247", text: "Use at least 8 characters." },
                { width: "25%", color: "#ef4444", text: "Weak password" },
                { width: "50%", color: "#f97316", text: "Fair password" },
                { width: "75%", color: "#eab308", text: "Good password" },
                { width: "100%", color: "#22c55e", text: "Strong password" }
            ];

            const level = value.length === 0 ? levels[0] : levels[score];

            strengthBar.style.width = level.width;
            strengthBar.style.backgroundColor = level.color;
            strengthText.textContent = level.text;

            if (confirmPassword.value) {
                confirmPassword.setCustomValidity(
                    password.value === confirmPassword.value
                        ? ""
                        : "Passwords do not match."
                );
            }
        });

        // Confirm password validation
        confirmPassword.addEventListener("input", function () {
            confirmPassword.setCustomValidity(
                password.value === confirmPassword.value
                    ? ""
                    : "Passwords do not match."
            );
        });

        // Handle form submission
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            message.className = "message";
            message.textContent = "";

            if (password.value !== confirmPassword.value) {
                confirmPassword.setCustomValidity(
                    "Passwords do not match."
                );
                confirmPassword.reportValidity();
                return;
            }

            confirmPassword.setCustomValidity("");

            message.textContent =
                "Form validated successfully! Connect a backend to create your account.";
            message.className = "message success";

            // Demo only: no account is created and no data is stored.
        });
    </script>
